name: CI/CD Pipeline to VirtualBox Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Unit Tests
        run: npm test

  deploy:
    name: Deploy to Local VirtualBox Server
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js Dependencies
        run: npm ci --omit=dev

      - name: Restart Application via PM2
        run: |
          pm2 reload express-app --update-env || pm2 start src/server.js --name "express-app"
          pm2 save

